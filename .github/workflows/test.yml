name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  self-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # An Arch container for vercmp: version ordering has to be decided by
      # the same comparator pacman uses on users' machines.
      - name: Run self-tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            docker.io/archlinux/archlinux:base-devel-20260829.0.582217@sha256:fdb1815d139014c57a768896ed60d52e67d757914c918b7c3a50b7218373ec5f bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm git jq
              git config --global --add safe.directory /workspace
              ./bin/sync-upstream self-test
              ./bin/omarchy-pkgs self-test
              ./bin/omarchy-release self-test
              ./bin/sync-rebuilds --self-test
              for test_script in test/*.sh; do
                bash "$test_script"
              done
            '
